# GitHub Actions：FTPS で gkmyt.net の apps/<アプリ>/ に上げる（手動実行だけ）
# 2026-11-11 から自動実行を止めた。さくらの国外IPアドレスフィルタで GitHub（米国）からの FTP が切られるため、
# サーバーへは Mac の publish-github.sh が直接 FTPS で上げる。フィルタを無効にしたときだけ手動で使える。
name: Deploy to gkmyt.net
on:
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: FTPS で上げる（前回から変わったファイルだけ）
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            README.md
